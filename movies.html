function nxMovieLinks(){return Object.assign({},NX_DRIVE_LINKS,NX_WORKBOOK_LINKS,get('movie_drive_links',{}))}
function nxCSV(text){const out=[];let row=[],field='',quoted=false;for(let i=0;i<text.length;i++){let c=text[i];if(c==='"'){if(quoted&&text[i+1]==='"'){field+='"';i++}else quoted=!quoted}else if(c===','&&!quoted){row.push(field);field=''}else if((c==='\n'||c==='\r')&&!quoted){if(c==='\r'&&text[i+1]==='\n')i++;row.push(field);if(row.some(x=>x.trim()))out.push(row);row=[];field=''}else field+=c}row.push(field);if(row.some(x=>x.trim()))out.push(row);return out}
function nxDriveUrl(value){let v=String(value||'').trim(),m=v.match(/(?:drive\.google\.com\/(?:file\/d\/|open\?id=)|docs\.google\.com\/file\/d\/)([\w-]+)/i);if(m)return 'https://drive.google.com/file/d/'+m[1]+'/view';if(/^https:\/\//i.test(v))return v;return ''}
RENDER.movies=el=>{const sheetTitles=[...new Set([...NX_SHEET_TITLES,...Object.keys(NX_WORKBOOK_LINKS)])],tmdb=NX_MOVIE_ITEMS;const normalize=t=>t.toLowerCase().replace(/[^a-z0-9]/g,'');const byTitle=new Map(tmdb.map(m=>[normalize(m.title),m]));
 const titleAliases={'avengersendgame':'avengersendgame','avengersinfinitywar':'avengersinfinitywar','theavengers':'avengers','spidermanintothespiderverse':'spidermanintothespiderverse','spidermannowayhome':'spidermannowayhome','thebossbaby':'bossbaby','despicableme3':'despicableme3'};
 function nxCleanMovieTitle(title){return normalize(String(title).replace(/\b(?:19|20)\d{2}\b/g,'').replace(/\b(?:movie|film|full movie|hd|1080p|720p|season \d+|s\d+e\d+|episode \d+)\b/gi,'').replace(/\s*[-–—:]\s*(?:english|dubbed|subbed|complete).*$/i,''))}
 function findPoster(title){
   const key=normalize(title),clean=nxCleanMovieTitle(title);
   const options=[key,clean,key.replace(/^the/,''),clean.replace(/^the/,'')];
   for(const k of options){const exact=byTitle.get(k)||byTitle.get(titleAliases[k]);if(exact?.poster)return exact}
   const candidates=tmdb.filter(m=>{const k=normalize(m.title);return options.some(o=>o&&o.length>=5&&(k===o||k.replace(/^the/,'')===o))&&m.poster});
   return candidates.length===1?candidates[0]:null;
 }
 // Wikipedia's page thumbnail is a fallback only; it is not guaranteed to be a theatrical poster.
 const nxPosterCache=new Map();
 async function nxFindExtraPoster(title){
   if(nxPosterCache.has(title))return nxPosterCache.get(title);
   const base=String(title).replace(/\b(?:19|20)\d{2}\b/g,'').replace(/\b(?:full movie|1080p|720p|hd)\b/gi,'').trim();
   const variants=[base,base+' (film)',base+' (TV series)'];
   for(const candidate of variants){
     try{
       const api='https://en.wikipedia.org/api/rest_v1/page/summary/'+encodeURIComponent(candidate.replace(/ /g,'_'));
       const r=await fetch(api,{signal:AbortSignal.timeout(4500)});
       if(!r.ok)continue;const data=await r.json();
       const label=String(data.title||'').replace(/\s*\([^)]*\)\s*$/,'');
       if(nxCleanMovieTitle(label)!==nxCleanMovieTitle(base))continue;
       const desc=String(data.description||'').toLowerCase();
       if(!/(film|movie|television|tv series|anime|series|documentary|show)/.test(desc))continue;
       const image=data.thumbnail?.source||data.originalimage?.source;
       if(image&&/^https:\/\//.test(image)){nxPosterCache.set(title,image);return image}
     }catch(_){}
   }
   nxPosterCache.set(title,null);return null;
 }
 async function nxFillMissingPosters(grid){
   const nodes=[...grid.querySelectorAll('[data-nx-poster-missing]')];
   let next=0;
   await Promise.all(Array.from({length:Math.min(3,nodes.length)},async()=>{
     while(next<nodes.length){const node=nodes[next++];if(!node.isConnected)continue;
       const title=node.dataset.nxPosterMissing;
       const image=await nxFindExtraPoster(title);
       if(image&&node.isConnected&&node.dataset.nxPosterMissing===title){
         const img=document.createElement('img');img.loading='lazy';img.alt='';img.referrerPolicy='no-referrer';img.onerror=()=>img.remove();img.src=image;
         node.insertBefore(img,node.firstChild);const placeholder=node.querySelector('.movie-poster-placeholder');if(placeholder)placeholder.style.display='none';
       }
     }
   }));
 }

tle":"Michael Jackson: The Verdict","poster":"/8R40yI5AJ931Hd3P4Yf8pdFgwJ1.jpg","date":"2026-06-03","overview":"Told by key players who were inside the courtroom, this comprehensive documentary dissects the trial of Michael Jackson and his complex legacy."},{"id":224941,"type":"tv","title":"The Boroughs","poster":"/oKxBWbXmnWFO2Wh1QRTtshdfIRa.jpg","date":"2026-05-21","overview":"In a seemingly perfect retirement community, a crew of unlikely heroes must stop an otherworldly threat from stealing the one thing they don't have: time."},{"id":284110,"type":"tv","title":"The Lead","poster":"/vnoSyfH40sisQ6jBSap7NB3LD4H.jpg","date":"2026-05-10","overview":"Yi Qin'e is taken to the cultural troupe by her uncle Hu Sanyuan to learn to sing Qinqiang Opera. From then on, her life unfolds with ups and downs. She achieves glorious artistic accomplishments, yet also experiences a profound sense of loneliness beyond ordinary people's comprehension."},{"id":289147,"type":"tv","title":"The Ferry Man 10th Anniversary","poster":"/9ilVMG2ueA0xrviD0A9WoluAcnF.jpg","date":"2026-06-02","overview":"At Mirage City's 444 Convenience Store, Xia Dongqing and Ya join forces with a cryptic Night Watcher to maintain the balance between realms—until a crimson moon exposes a hidden conspiracy. Though peace returns, new anomalies stir in the shadows."},{"id":87917,"type":"tv","title":"For All Mankind","poster":"/JP3DItWMbrrLiKR5AYUfpsNf2b.jpg","date":"2019-11-01","overview":"Explore an aspirational world where NASA and the space program remained a priority and a focal point of our hopes and dreams as told through the lives of NASA astronauts, engineers, and their families."},{"id":2734,"type":"tv","title":"Law & Order: Special Victims Unit","poster":"/iofokHZoUB4Qhik4PflvJl8TT6a.jpg","date":"1999-09-20","overview":"In the criminal justice system, sexually-based offenses are considered especially heinous. In New York City, the dedicated detectives who investigate these vicious felonies are members of an elite squad known as the Special Victims Unit. These are their stories."},{"id":2354,"type":"tv","title":"Home and Away","poster":"/vn0eKMiG69bhQtxb7qLRo8SSqu5.jpg","date":"1988-01-18","overview":"Home and Away is set in the fictional town of Summer Bay, a coastal town in New South Wales, and follows the personal and professional lives of the people living in the area. The show initially focused on the Fletcher family, Pippa and Tom Fletcher and their five foster children Frank Morgan, Carly Morris, Steven Matheson, Lynn Davenport and Sally Keating, who would go on to become one of the show's longest-running characters. The show also originally and currently focuses on the Stewart family. Home and Away had proved popular when it premiered in 1988 and had risen to become a hit in Australia, and after only a few weeks, the show tackled its first major and disturbing storyline, the rape of Carly Morris; it was one of the first shows to feature such storylines during the early timeslot. H&A has tackled many adult-themed and controversial storylines; something rarely found in its restricted timeslot."},{"id":79744,"type":"tv","title":"The Rookie","poster":"/70kTz0OmjjZe7zHvIDrq2iKW7PJ.jpg","date":"2018-10-16","overview":"Starting over isn't easy, especially for small-town guy John Nolan who, after a life-altering incident, is pursuing his dream of being an LAPD officer. As the force's oldest rookie, he's met with skepticism from some higher-ups who see him as just a walking midlife crisis."},{"id":549,"type":"tv","title":"Law & Order","poster":"/haJ9eHytVO3H3JooMJG1DiWwDNm.jpg","date":"1990-09-13","overview":"In cases ripped from the headlines, police investigate serious and often deadly crimes, weighing the evidence and questioning the suspects until someone is taken into custody. The district attorney's office then builds a case to convict the perpetrator by proving the person guilty beyond a reasonable doubt. Working together, these expert teams navigate all sides of the complex criminal justice system to make New York a safer place."},{"id":1416,"type":"tv","title":"Grey's Anatomy","poster":"/hjJkrLXhWvGHpLeLBDFznpBTY1S.jpg","date":"2005-03-27","overview":"Follows the personal and professional lives of a group of doctors at Seattle's Grey Sloan Memorial Hospital."},{"id":1622,"type":"tv","title":"Supernatural","poster":"/8iixmfGx5EIFPdpNvB2JvI3VIqX.jpg","date":"2005-09-13","overview":"When they were boys, Sam and Dean Winchester lost their mother to a mysterious and demonic supernatural force. Subsequently, their father raised them to be soldiers. He taught them about the paranormal evil that lives in the dark corners and on the back roads of America ... and he taught them how to kill it. Now, the Winchester brothers crisscross the country in their '67 Chevy Impala, battling every kind of supernatural threat they encounter along the way. "},{"id":94722,"type":"tv","title":"Tagesschau","poster":"/7dFZJ2ZJJdcmkp05B9NWlqTJ5tq.jpg","date":"1952-12-26","overview":"German daily news program, the oldest still existing program on German television."},{"id":4614,"type":"tv","title":"NCIS","poster":"/mBcu8d6x6zB1el3MPNl7cZQEQ31.jpg","date":"2003-09-23","overview":"From murder and espionage to terrorism and stolen submarines, a team of special agents investigates any crime that has any connection to Navy and Marine Corps personnel, regardless of rank or position."},{"id":1399,"type":"tv","title":"Game of Thrones","poster":"/1XS1oqL89opfnbLl8WnZY1O1uJx.jpg","date":"2011-04-17","overview":"Seven noble families fight for control of the mythical land of Westeros. Friction between the houses leads to full-scale war. All while a very ancient evil awakens in the farthest north. Amidst the war, a neglected military order of misfits, the Night's Watch, is all that stands between the realms of men and icy horrors beyond."},{"id":4057,"type":"tv","title":"Criminal Minds","poster":"/hWSb4UnIjlTvnvrP98NbFSO60HA.jpg","date":"2005-09-22","overview":"An elite team of FBI profilers analyze the country's most twisted criminal minds, anticipating their next moves before they strike again. The Behavioral Analysis Unit's most experienced agent is David Rossi, a founding member of the BAU who returns to help the team solve new cases."},{"id":456,"type":"tv","title":"The Simpsons","poster":"/uWpG7GqfKGQqX4YMAo3nv5OrglV.jpg","date":"1989-12-17","overview":"Set in Springfield, the average American town, the show focuses on the antics and everyday adventures of the Simpson family; Homer, Marge, Bart, Lisa and Maggie, as well as a virtual cast of thousands. Since the beginning, the series has been a pop culture icon, attracting hundreds of celebrities to guest star. The show has also made name for itself in its fearless satirical take on politics, media and American life in general."},{"id":5920,"type":"tv","title":"The Mentalist","poster":"/acYXu4KaDj1NIkMgObnhe4C4a0T.jpg","date":"2008-09-23","overview":"Patrick Jane, a former celebrity psychic medium, uses his razor sharp skills of observation and expertise at \"reading\" people to solve serious crimes with the California Bureau of Investigation."},{"id":2261,"type":"tv","title":"The Tonight Show Starring Johnny Carson","poster":"/uSvET5YUvHNDIeoCpErrbSmasFb.jpg","date":"1962-10-01","overview":"The Tonight Show Starring Johnny Carson is a talk show hosted by Johnny Carson under The Tonight Show franchise from 1962 to 1992. It originally aired during late-night. For its first ten years, Carson's Tonight Show was based in New York City with occasional trips to Burbank, California; in May 1972, the show moved permanently to Burbank, California. In 2002, The Tonight Show Starring Johnny Carson was ranked #12 on TV Guide's 50 Greatest TV Shows of All Time."},{"id":1434,"type":"tv","title":"Family Guy","poster":"/3PFsEuAiyLkWsP4GG6dIV37Q6gu.jpg","date":"1999-01-31","overview":"Sick, twisted, politically incorrect and Freakin' Sweet animated series featuring the adventures of the dysfunctional Griffin family. Bumbling Peter and long-suffering Lois have three kids. Stewie (a brilliant but sadistic baby bent on killing his mother and taking over the world), Meg (the oldest, and is the most unpopular girl in town) and Chris (the middle kid, he's not very bright but has a passion for movies). The final member of the family is Brian - a talking dog and much more than a pet, he keeps Stewie in check whilst sipping Martinis and sorting through his own life issues."},{"id":22980,"type":"tv","title":"Watch What Happens Live with Andy Cohen","poster":"/onSD9UXfJwrMXWhq7UY7hGF2S1h.jpg","date":"2009-07-16","overview":"Bravo network executive Andy Cohen discusses pop culture topics with celebrities and reality show personalities."},{"id":1396,"type":"tv","title":"Breaking Bad","poster":"/ztkUQFLlC19CCMYHW9o1zWhJRNq.jpg","date":"2008-01-20","overview":"Walter White, a New Mexico chemistry teacher, is diagnosed with Stage III cancer and given a prognosis of only two years left to live. He becomes filled with a sense of fearlessness and an unrelenting desire to secure his family's financial future at any cost as he enters the dangerous world of drugs and crime."},{"id":209867,"type":"tv","title":"Frieren: Beyond Journey's End","poster":"/dqZENchTd7lp5zht7BdlqM7RBhD.jpg","date":"2023-09-29","overview":"After the party of heroes defeated the Demon King, they restored peace to the land and returned to lives of solitude.  Generations pass, and the elven mage Frieren comes face to face with humanity’s mortality. She takes on a new apprentice and promises to fulfill old friends’ dying wishes. Can an elven mind make peace with the nature of life and death? Frieren embarks on her quest to find out."},{"id":64010,"type":"tv","title":"Reply 1988","poster":"/i3xQJlQRff4k5IMEY55l4iKaKl3.jpg","date":"2015-11-06","overview":"Take a nostalgic trip back to the late 1980s through the lives of five families and their five teenage kids living in a small neighbourhood in Seoul."},{"id":246,"type":"tv","title":"Avatar: The Last Airbender","poster":"/9RQhVb3r3mCMqYVhLoCu4EvuipP.jpg","date":"2005-02-21","overview":"In a war-torn world of elemental magic, a young boy reawakens to undertake a dangerous mystic quest to fulfill his destiny as the Avatar, and bring peace to the world."},{"id":94605,"type":"tv","title":"Arcane","poster":"/abf8tHznhSvl9BAElD2cQeRr7do.jpg","date":"2021-11-06","overview":"Amid the stark discord of twin cities Piltover and Zaun, two sisters fight on rival sides of a war between magic technologies and clashing convictions."},{"id":250307,"type":"tv","title":"The Pitt","poster":"/kvFSpESyBZMjaeOJDx7RS3P1jey.jpg","date":"2025-01-09","overview":"The staff of Pittsburgh's Trauma Medical Center work around the clock to save lives in an overcrowded and underfunded emergency department."},{"id":85077,"type":"tv","title":"The Chosen","poster":"/dqVUFuNrMFWt7uGNWlpo91VKYOI.jpg","date":"2019-04-21","overview":"The life of Christ through the eyes of those who encountered him."},{"id":301507,"type":"tv","title":"Heated Rivalry","poster":"/3YCKbtAkYWCMDLHvkUjGhG7eWoS.jpg","date":"2025-11-28","overview":"Two of the biggest stars in Major League Hockey are bound by ambition, rivalry, and a magnetic pull neither of them fully understands. What begins as a secret fling between two fresh faced rookies evolves into a years-long journey of love, denial, and self-discovery. Over the next eight years, as they chase glory on the ice, they struggle to navigate their feelings for each other. Torn between the sport they live for and the love they can’t ignore, they must decide if there’s room in their fiercely competitive world for something as fragile – and powerful – as real love."},{"id":87108,"type":"tv","title":"Chernobyl","poster":"/hlLXt2tOPT6RRnjiUmoxyG1LTFi.jpg","date":"2019-05-06","overview":"The true story of one of the worst man-made catastrophes in history: the catastrophic nuclear accident at Chernobyl. A tale of the brave men and women who sacrificed to save Europe from unimaginable disaster."},{"id":219246,"type":"tv","title":"When Life Gives You Tangerines","poster":"/1VC3sEFxYXYDqQUCAnvWfUsYg1s.jpg","date":"2025-03-07","overview":"In Jeju, a spirited girl and a steadfast boy's island story blossoms into a lifelong tale of setbacks and triumphs — proving love endures across time."},{"id":31911,"type":"tv","title":"Fullmetal Alchemist: Brotherhood","poster":"/5ZFUEOULaVml7pQuXxhpR2SmVUw.jpg","date":"2009-04-05","overview":"Disregard for alchemy’s laws ripped half of Edward Elric’s limbs from his body and left his brother Alphonse’s soul clinging to a suit of armor. To restore what was lost, the brothers seek the Philosopher’s Stone. Enemies and allies – the corrupt military, the Homunculi, and foreign alchemists – will alter the Elric brothers course, but their purpose will remain unchanged and their bond unbreakable."},{"id":60059,"type":"tv","title":"Better Call Saul","poster":"/zjg4jpK1Wp2kiRvtt5ND0kznako.jpg","date":"2015-02-08","overview":"Six years before Saul Goodman meets Walter White. We meet him when the man who will become Saul Goodman is known as Jimmy McGill, a small-time lawyer searching for his destiny, and, more immediately, hustling to make ends meet. Working alongside, and, often, against Jimmy, is “fixer” Mike Ehrmantraut. The series tracks Jimmy’s transformation into Saul Goodman, the man who puts “criminal” in “criminal lawyer\"."},{"id":271607,"type":"tv","title":"The Fragrant Flower Blooms with Dignity","poster":"/g1sYAQt0OeCxzyfagSEqxUlsLnt.jpg","date":"2025-07-06","overview":"When the intimidating Rintaro meets the open-minded Kaoruko, the unlikely duo grows closer. The issue? Their neighboring high schools hate each other."},{"id":1429,"type":"tv","title":"Attack on Titan","poster":"/hTP1DtLGFamjfu8WqjnuQdP1n4i.jpg","date":"2013-04-07","overview":"100 years ago, the last remnants of humanity were forced to retreat behind the towering walls of a fortified city to escape the massive, man-eating Titans that roamed the land outside their fortress. Only the members of the Scouting Legion dared to stray beyond the safety of the walls – but even those brave warriors seldom returned alive. Those within the city clung to the illusion of a peaceful existence until the day that dream was shattered, and their slim chance at survival was reduced to one horrifying choice: kill – or be devoured!"},{"id":1398,"type":"tv","title":"The Sopranos","poster":"/rTc7ZXdroqjkKivFPvCPX0Ru7uw.jpg","date":"1999-01-10","overview":"The story of New Jersey-based Italian-American mobster Tony Soprano and the difficulties he faces as he tries to balance the conflicting requirements of his home life and the criminal organization he heads. Those difficulties are often highlighted through his ongoing professional relationship with psychiatrist Jennifer Melfi. The show features Tony's family members and Mafia associates in prominent roles and story arcs, most notably his wife Carmela and his cousin and protégé Christopher Moltisanti."},{"id":200709,"type":"tv","title":"Weak Hero","poster":"/dbqNBeLvAWFqpAvdBc0cecaqytT.jpg","date":"2022-11-18","overview":"With the aid of unexpected friends, a gifted but introverted student confronts bullies and violent foes — unaware of how dangerous his world will become."}];
