<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NEXORA 5</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{background:radial-gradient(circle at top,#152e29,#05080b 70%);color:#effff9;font:15px system-ui,Segoe UI,sans-serif;margin:0}header{padding:20px 25px;border-bottom:1px solid #31483e;display:flex;align-items:center;gap:15px}h1{letter-spacing:3px;font-size:24px;margin:0;flex:1}h1 b{color:#53ffbf}button{cursor:pointer;color:inherit;background:#182823;border:1px solid #365e4e;border-radius:10px;padding:10px 15px;font:inherit}button:hover{border-color:#53ffbf}main{max-width:1200px;margin:auto;padding:24px}.notice{padding:15px;border:1px solid #315e4b;background:#10231c;border-radius:12px;margin-bottom:25px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:14px}.tile{height:140px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px}.tile span{font-size:36px}.muted{color:#9ab7a9}#window{position:fixed;inset:0;background:#060a0d;display:none;flex-direction:column;z-index:10}.bar{height:51px;display:flex;align-items:center;gap:10px;padding:0 12px;background:#14221d;border-bottom:1px solid #315e4b}.bar strong{flex:1}iframe{border:0;flex:1;width:100%;min-height:0;background:#080c11}@media(max-width:550px){main{padding:12px}.grid{grid-template-columns:repeat(2,1fr)}} </style></head><body><header><h1>NEXORA <b>5</b></h1><button id="reload">↻ Refresh</button></header><main><div class="notice">This is the new version of the website and it's not done yet. I just published it for testing.</div><h2>Apps</h2><p class="muted" id="status">Finding apps on GitHub…</p><div class="grid" id="tiles"></div></main><section id="window"><div class="bar"><strong id="title"></strong><button id="tab">↗ Full tab</button><button id="close">✕ Close</button></div><iframe id="frame" allow="fullscreen;clipboard-write" allowfullscreen></iframe></section><script>
'use strict';const OWNER='AGPRO619',REPO='nexora',BRANCH='main';const BASE=`https://raw.githubusercontent.com/${OWNER}/${REPO}/${BRANCH}/`;const API=`https://api.github.com/repos/${OWNER}/${REPO}/contents?ref=${BRANCH}`;const $=id=>document.getElementById(id);let active='';const icons={games:'🎮',school:'🎓',graphforge:'📐',stocks:'📈',movies:'🎬',ai:'✨',messages:'💬',video:'▶️',music:'🎵',appmanager:'📦',settings:'⚙️'};const titles={appmanager:'App Manager',graphforge:'GraphForge'};function valid(p){return /^[a-z][a-z0-9_-]*\.html$/i.test(p)&&p.toLowerCase()!=='nexora.html'}function openApp(a){active=BASE+encodeURIComponent(a.file)+'?v='+Date.now();$('title').textContent=(a.icon||'📦')+' '+a.name;$('frame').src=active;$('window').style.display='flex'}$('close').onclick=()=>{$('window').style.display='none';$('frame').src='about:blank'};$('tab').onclick=()=>{if(active)window.open(active,'_blank','noopener')};$('reload').onclick=load;async function load(){$('status').textContent='Loading GitHub apps…';$('tiles').replaceChildren();let apps=[];try{const r=await fetch(BASE+'apps.json?v='+Date.now(),{cache:'no-store'});if(r.ok){const m=await r.json();apps=(m.apps||[]).filter(a=>valid(a.file))}}catch(e){}if(true){try{const r=await fetch(API,{cache:'no-store'});if(!r.ok)throw Error('GitHub API '+r.status);const files=await r.json();apps=files.filter(f=>f.type==='file'&&valid(f.name)).map(f=>{const existing=apps.find(a=>a.file===f.name);return existing||{id:f.name.slice(0,-5),file:f.name,name:titles[f.name.slice(0,-5)]||f.name.slice(0,-5).replace(/[-_]/g,' '),icon:icons[f.name.slice(0,-5)]||'📦'}})}catch(e){if(!apps.length){$('status').textContent='Could not discover apps: '+e.message;return}}}for(const a of apps){const b=document.createElement('button');b.className='tile';const icon=document.createElement('span');icon.textContent=a.icon||icons[a.id]||'📦';const label=document.createElement('strong');label.textContent=a.name;b.append(icon,label);b.onclick=()=>openApp(a);$('tiles').append(b)}$('status').textContent=apps.length+' independent apps found. Edit any root-level app file on GitHub to update it.'}load();
</script></body></html>
