    el.style.display='flex';el.style.flexDirection='column';
    el.style.padding='0';el.style.overflow='hidden';
  }catch(err){
    el.innerHTML='<div class="card" style="margin:18px"><h3>Could not load '+esc(id)+'</h3><p class="muted">'+esc(err.message)+'</p><p>Check that <code>'+esc(id)+'.html</code> exists on branch <code>'+esc(NX_BRANCH)+'</code> and your internet connection is working.</p><button class="btn primary" id="nxRetryApp">Retry</button> <a target="_blank" rel="noopener noreferrer" href="'+NX_RAW+encodeURIComponent(id)+'.html">View source on GitHub</a></div>';
    el.querySelector('#nxRetryApp').onclick=()=>nxLoadExternalApp(el,id);
  }
}
async function nxDiscoverApps(){
  try{
    const res=await fetch(NX_API,{cache:'no-store'});
    if(!res.ok)throw Error('GitHub API '+res.status);
    const files=await res.json();
    let changed=false;
    for(const file of files){
      if(file.type!=='file'||!file.name.endsWith('.html')||file.name==='nexora.html')continue;
      const id=file.name.slice(0,-5).toLowerCase();
      if(!/^[a-z0-9_-]+$/.test(id)||NX_APP_IDS.has(id))continue;
      const name=id.replace(/[-_]/g,' ').replace(/\b\w/g,c=>c.toUpperCase());
      APPS.push([id,name,'📄']);NX_APP_IDS.add(id);changed=true;
    }
    if(changed){renderHome();renderAllApps()}
  }catch(e){console.warn('GitHub app discovery unavailable; known apps still work:',e)}
}

(function(){let lines=document.getElementById('diagLines'),count=document.getElementById('diagCount'),retry=document.getElementById('diagRetry');if(!lines)return;let issues=[];function line(label,detail,bad){return `<div class="diag-line ${bad?'warn':'ok'}">${bad?'⚠':'✓'} <b>${esc(label)}</b> — ${esc(detail)}</div>`}async function check(){issues=[];let out=[];if(!navigator.onLine){issues.push('Offline');out.push(line('Internet','Browser reports offline. Games, music, movies and public chat may not load.',true))}else out.push(line('Internet','Browser reports online; individual sites may still be restricted.',false));if(!window.supabase?.createClient){issues.push('Public Chat');out.push(line('Messages','Realtime library did not load; public chat and movie sync cannot connect.',true))}else out.push(line('Messages','Realtime client loaded; actual chat connection is checked inside Messages.',false));try{let ctl=new AbortController(),timer=setTimeout(()=>ctl.abort(),5500);try{let r=await fetch('https://itunes.apple.com/search?term=test&limit=1',{signal:ctl.signal});if(!r.ok)throw Error('HTTP '+r.status);out.push(line('Music','iTunes API responded.',false))}finally{clearTimeout(timer)}}catch(e){issues.push('Music');out.push(line('Music','Preview search unreachable ('+(e.name==='AbortError'?'timeout':e.message)+'). Network filtering is one possible cause.',true))}out.push(line('Movies','Catalog is built in; poster images and spreadsheet require external access.',false));out.push(line('Games','External game hosts are checked when a game is launched.',false));lines.innerHTML=out.join('');count.textContent=issues.length?issues.length+' POSSIBLE ISSUES':'NO ISSUES DETECTED'}retry.onclick=check;setTimeout(check,600)})();
// Lightweight moving network behind the home screen; respects visual settings and reduced-motion.
(function(){const canvas=document.getElementById('particleNet');if(!canvas)return;const ctx=canvas.getContext('2d');if(!ctx)return;let pts=[],w=0,h=0;const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;function size(){let rect=canvas.getBoundingClientRect(),dpr=Math.min(devicePixelRatio||1,2);w=rect.width;h=rect.height;canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);pts=Array.from({length:Math.min(90,Math.max(35,Math.floor(w*h/14500)))},()=>({x:Math.random()*w,y:Math.random()*h,vx:(Math.random()-.5)*.48,vy:(Math.random()-.5)*.48,r:1+Math.random()*1.2}))}function draw(){ctx.clearRect(0,0,w,h);if(prefs.particles!==false){let color=(prefs.accent||'#53ffbf');for(let i=0;i<pts.length;i++){let a=pts[i];if(!reduced){a.x+=a.vx;a.y+=a.vy;if(a.x<0||a.x>w)a.vx*=-1;if(a.y<0||a.y>h)a.vy*=-1}for(let j=i+1;j<pts.length;j++){let b=pts[j],dx=a.x-b.x,dy=a.y-b.y,d=dx*dx+dy*dy;if(d<195*195){ctx.strokeStyle='rgba(106,198,173,'+(0.27*(1-d/(195*195))).toFixed(3)+')';ctx.lineWidth=.85;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke()}}ctx.fillStyle=i%4===0?color:'#648c88';ctx.globalAlpha=.7;ctx.beginPath();ctx.arc(a.x,a.y,a.r,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1}}requestAnimationFrame(draw)}size();addEventListener('resize',size);requestAnimationFrame(draw)})();
