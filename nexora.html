let nxRemoteConfigPromise;
async function nxLoadRemoteConfig(){
 if(nxRemoteConfigPromise)return nxRemoteConfigPromise;
 nxRemoteConfigPromise=(async()=>{
  const base=String(NEXORA_API.GITHUB_CONFIG_BASE||'').trim();
  const exact=String(NEXORA_API.GITHUB_CONFIG_URL||'').trim();
  const candidates=[];
  if(exact){
   candidates.push(exact);
   // If a configured file was renamed, try the alternative in the same folder.
   if(/\/(?:nexora-config|file)\.json(?:[?#].*)?$/i.test(exact)){
    const folder=exact.replace(/(?:nexora-config|file)\.json(?:[?#].*)?$/i,'');
    candidates.push(folder+'nexora-config.json',folder+'file.json');
   }
  }
  if(base){const folder=base.endsWith('/')?base:base+'/';candidates.push(folder+'nexora-config.json',folder+'file.json')}
  const unique=[...new Set(candidates)];
  if(!unique.length)return 'Local HTML settings (no GitHub config location set)';
  const errors=[];
  for(const address of unique){
   try{
    const u=new URL(address,location.href);
    if(u.protocol!=='https:')throw Error('HTTPS required');
    const r=await fetch(u.href,{cache:'no-store'});
    if(!r.ok)throw Error('HTTP '+r.status);
    const cfg=await r.json();
    if(!cfg||typeof cfg!=='object'||Array.isArray(cfg))throw Error('Invalid JSON object');
    for(const k of ['GEMINI_API_KEY','GEMINI_MODEL','FINNHUB_API_KEY','STOCK_PROVIDER','YAHOO_CORS_PROXY']){
     if(typeof cfg[k]==='string'&&cfg[k].trim())NEXORA_API[k]=cfg[k].trim();
    }
    return 'GitHub config loaded: '+u.pathname.split('/').pop();
   }catch(e){errors.push(e.message)}
  }
  throw Error('Could not load nexora-config.json or file.json from GitHub ('+errors.join('; ')+')');
 })();return nxRemoteConfigPromise;
}

function nxMovieLinks(){return Object.assign({},NX_DRIVE_LINKS,NX_WORKBOOK_LINKS,get('movie_drive_links',{}))}
function nxCSV(text){const out=[];let row=[],field='',quoted=false;for(let i=0;i<text.length;i++){let c=text[i];if(c==='"'){if(quoted&&text[i+1]==='"'){field+='"';i++}else quoted=!quoted}else if(c===','&&!quoted){row.push(field);field=''}else if((c==='\n'||c==='\r')&&!quoted){if(c==='\r'&&text[i+1]==='\n')i++;row.push(field);if(row.some(x=>x.trim()))out.push(row);row=[];field=''}else field+=c}row.push(field);if(row.some(x=>x.trim()))out.push(row);return out}
function nxDriveUrl(value){let v=String(value||'').trim(),m=v.match(/(?:drive\.google\.com\/(?:file\/d\/|open\?id=)|docs\.google\.com\/file\/d\/)([\w-]+)/i);if(m)return 'https://drive.google.com/file/d/'+m[1]+'/view';if(/^https:\/\//i.test(v))return v;return ''}
RENDER.movies=el=>{const sheetTitles=[...new Set([...NX_SHEET_TITLES,...Object.keys(NX_WORKBOOK_LINKS)])],tmdb=NX_MOVIE_ITEMS;const normalize=t=>t.toLowerCase().replace(/[^a-z0-9]/g,'');const byTitle=new Map(tmdb.map(m=>[normalize(m.title),m]));
 const titleAliases={'avengersendgame':'avengersendgame','avengersinfinitywar':'avengersinfinitywar','theavengers':'avengers','spidermanintothespiderverse':'spidermanintothespiderverse','spidermannowayhome':'spidermannowayhome','thebossbaby':'bossbaby','despicableme3':'despicableme3'};
 function nxCleanMovieTitle(title){return normalize(String(title).replace(/\b(?:19|20)\d{2}\b/g,'').replace(/\b(?:movie|film|full movie|hd|1080p|720p|season \d+|s\d+e\d+|episode \d+)\b/gi,'').replace(/\s*[-–—:]\s*(?:english|dubbed|subbed|complete).*$/i,''))}
 function findPoster(title){
   const key=normalize(title),clean=nxCleanMovieTitle(title);
   const options=[key,clean,key.replace(/^the/,''),clean.replace(/^the/,'')];
   for(const k of options){const exact=byTitle.get(k)||byTitle.get(titleAliases[k]);if(exact?.poster)return exact}
   const candidates=tmdb.filter(m=>{const k=normalize(m.title);return options.some(o=>o&&o.length>=5&&(k===o||k.replace(/^the/,'')===o))&&m.poster});
   return candidates.length===1?candidates[0]:null;
 }
 // Wikipedia's page thumbnail is a fallback only; it is not guaranteed to be a theatrical poster.
 const nxPosterCache=new Map();
 async function nxFindExtraPoster(title){
   if(nxPosterCache.has(title))return nxPosterCache.get(title);
   const base=String(title).replace(/\b(?:19|20)\d{2}\b/g,'').replace(/\b(?:full movie|1080p|720p|hd)\b/gi,'').trim();
   const variants=[base,base+' (film)',base+' (TV series)'];
   for(const candidate of variants){
     try{
       const api='https://en.wikipedia.org/api/rest_v1/page/summary/'+encodeURIComponent(candidate.replace(/ /g,'_'));
       const r=await fetch(api,{signal:AbortSignal.timeout(4500)});
       if(!r.ok)continue;const data=await r.json();
       const label=String(data.title||'').replace(/\s*\([^)]*\)\s*$/,'');
       if(nxCleanMovieTitle(label)!==nxCleanMovieTitle(base))continue;
       const desc=String(data.description||'').toLowerCase();
       if(!/(film|movie|television|tv series|anime|series|documentary|show)/.test(desc))continue;
       const image=data.thumbnail?.source||data.originalimage?.source;
       if(image&&/^https:\/\//.test(image)){nxPosterCache.set(title,image);return image}
     }catch(_){}
   }
   nxPosterCache.set(title,null);return null;
 }
 async function nxFillMissingPosters(grid){
   const nodes=[...grid.querySelectorAll('[data-nx-poster-missing]')];
   let next=0;
   await Promise.all(Array.from({length:Math.min(3,nodes.length)},async()=>{
     while(next<nodes.length){const node=nodes[next++];if(!node.isConnected)continue;
       const title=node.dataset.nxPosterMissing;
       const image=await nxFindExtraPoster(title);
       if(image&&node.isConnected&&node.dataset.nxPosterMissing===title){
         const img=document.createElement('img');img.loading='lazy';img.alt='';img.referrerPolicy='no-referrer';img.onerror=()=>img.remove();img.src=image;
         node.insertBefore(img,node.firstChild);const placeholder=node.querySelector('.movie-poster-placeholder');if(placeholder)placeholder.style.display='none';
       }
     }
   }));
 }

o surpass the limitations on human space travel and conquer the vast distances involved in an interstellar voyage."},{"id":429,"type":"movie","title":"The Good, the Bad and the Ugly","poster":"/bX2xnavhMYjWDoZp1VM6VnU1xwe.jpg","date":"1966-12-23","overview":"While the Civil War rages on between the Union and the Confederacy, three men – a quiet loner, a ruthless hitman, and a Mexican bandit – comb the American Southwest in search of a strongbox containing $200,000 in stolen gold."},{"id":13,"type":"movie","title":"Forrest Gump","poster":"/Cw4hIUIAmSYfK9QfaUW5igp9La.jpg","date":"1994-06-23","overview":"A man with a low IQ has accomplished great things in his life and been present during significant historic events—in each case, far exceeding what anyone imagined he could do. But despite all he has achieved, his one true love eludes him."},{"id":1320660,"type":"movie","title":"Pati Patni Aur Woh Do","poster":"/x0RUPvba4JlCCkyyEZGlQFIFVuF.jpg","date":"2026-05-15","overview":"A seemingly perfect marriage in Prayagraj takes an unexpected turn when one decision leads to a chain of misunderstandings, suspicion, and comedic chaos."},{"id":1367220,"type":"movie","title":"Karuppu","poster":"/4KZXlZ5tTT6ghbW77gS4hSLkCd7.jpg","date":"2026-05-14","overview":"In a world where justice falters, guardian deity Vettai Karuppu takes the guise of a lawyer to battle a corrupt legal system preying on the powerless."},{"id":1239134,"type":"movie","title":"Bhooth Bangla","poster":"/79RBp8afL4u4z3nVGR78z6eIvBB.jpg","date":"2026-04-16","overview":"A man inherits a palace in rural Mangalpur and plans his sister's wedding there, but strange supernatural events and panicked locals force him to investigate the property's mysterious past."},{"id":1311031,"type":"movie","title":"Demon Slayer: Kimetsu no Yaiba Infinity Castle","poster":"/fWVSwgjpT2D78VUh6X8UBd2rorW.jpg","date":"2025-07-18","overview":"The Demon Slayer Corps are drawn into the Infinity Castle, where Tanjiro, Nezuko, and the Hashira  realized as her daughter becomes the next target. Determined to protect her family, Sidney must face the horrors of her past to put an end to the bloodshed once and for all."},{"id":803796,"type":"movie","title":"KPop Demon Hunters","poster":"/zT7Lhw3BhJbMkRqm9Zlx2YGMsY0.jpg","date":"2025-06-20","overview":"When K-pop superstars Rumi, Mira and Zoey aren't selling out stadiums, they're using their secret powers to protect their fans from supernatural threats."},{"id":1233413,"type":"movie","title":"Sinners","poster":"/oucvKATkCI77ngtPjxAI9SAZW42.jpg","date":"2025-04-16","overview":"Trying to leave their troubled lives behind, twin brothers return to their hometown to start again, only to discover that an even greater evil is waiting to welcome them back."},{"id":1057265,"type":"movie","title":"Peddi","poster":"/kydPBzuU4TSmDOXCkgAdVFF8sgU.jpg","date":"2026-06-03","overview":"In 1980s rural Andhra Pradesh, a spirited villager unites his community through sports to defend their pride against a powerful rival."},{"id":1242332,"type":"movie","title":"Normal","poster":"/rsNdDcCKjCZm9RBMAxL3vMUokKU.jpg","date":"2026-04-16","overview":"An unassuming substitute sheriff with a troubled past responds to a bank robbery in a small, sleepy town and unknowingly uncovers something far more explosive."},{"id":1368314,"type":"movie","title":"Passenger","poster":"/2sOEJzhPzjTkZSlPbGxOJ7xgIyS.jpg","date":"2026-05-20","overview":"After a young couple witnesses a gruesome highway accident, they soon realize they did not leave the crash scene alone, as a demonic presence called the Passenger that won't stop until it claims them both turns their van life adventure into a nightmare."},{"id":1340206,"type":"movie","title":"Tuner","poster":"/kyM60vcgf7lfofmZB4F5Rj7OrHW.jpg","date":"2026-05-21","overview":"A talented piano tuner's life is turned upside down when he discovers that his meticulous skills for tuning pianos can equally be applied to cracking safes."},{"id":220102,"type":"tv","title":"Spider-Noir","poster":"/oD8WSVqz84ZRfelkr7JPeJwR9Iv.jpg","date":"2026-05-25","overview":"Ben Reilly, an aging and down on his luck private investigator in 1930s New York, is forced to grapple with his past life as the city's one and only superhero."},{"id":85552,"type":"tv","title":"Euphoria","poster":"/aJrG7OkoTMPWG5c8opz8a93AZPY.jpg","date":"2019-06-16","overview":"A group of high school students navigate love and friendships in a world of drugs, sex, trauma, and social media."},{"id":76479,"type":"tv","title":"The Boys","poster":"/in1R2dDc421JxsoRWaIIAqVI2KE.jpg","date":"2019-07-25","overview":"A group of vigilantes known informally as “The Boys” set out to take down corrupt superheroes with no more than blue-collar grit and a willingness to fight dirty."},{"id":124364,"type":"tv","title":"FROM","poster":"/pRtJagIxpfODzzb0T0NAvZSzErC.jpg","date":"2022-02-20","overview":"Unravel the mystery of a nightmarish town in middle America that traps all those who enter. As the unwilling residents fight to keep a sense of normalcy and search for a way out, they must also survive the threats of the surrounding forest – including the terrifying creatures that come out when the sun goes down."},{"id":273240,"type":"tv","title":"Off Campus","poster":"/cbODFqkcmRgrYH8NkG4Q4Hcg8Z1.jpg","date":"2026-05-13","overview":"Hannah Wells tutors hockey captain Garrett Graham to win over her crush. Their deal becomes real connection as they face their pasts. Friends Logan, Dean, Tucker, and Allie navigate college life and love."},{"id":37854,"type":"tv","title":"One Piece","poster":"/dB4EDhre2dsC2kxYDavyKWqLQwi.jpg","date":"1999-10-20","overview":"Years ago, the fearsome Pirate King, Gol D. Roger was executed leaving a huge pile of treasure and the famous \"One Piece\" behind. Whoever claims the \"One Piece\" will be named the new King of the Pirates.\n\nMonkey D. Luffy, a boy who consumed a \"Devil Fruit,\" decides to follow in the footsteps of his idol, the pirate Shanks, and find the One Piece. It helps, of course, that his body has the properties of rubber and that he's surrounded by a bevy of skilled fighters and thieves to help him along the way.\n\nLuffy will do anything to get the One Piece and become King of the Pirates!"},{"id":252107,"type":"tv","title":"Star City","poster":"/jjJZyBCDgyYylGdtctuqEYcO7Lc.jpg","date":"2026-05-28","overview":"Step into a thrilling chapter inspired by For All Mankind. Same alt-history universe. Different perspective: the Soviet Union's. Go behind the Iron Curtain with the cosmonauts, engineers, and intelligence officers who risked it all in the race for the Moon."},{"id":270476,"type":"tv","title":"Widow's Bay","poster":"/5lcxWLVAEICkFpuAiV1aMy7ZZj3.jpg","date":"2026-04-28","overview":"The mayor of a New England town resolves to turn it into the next tourist hot spot, despite local warnings that it's cursed."},{"id":60625,"type":"tv","title":"Rick and Morty","poster":"/owhkU6KRqdXoUQpjV8uyZGPtX58.jpg","date":"2013-12-02","overview":"Follows a sociopathic genius scientist who drags his inherently timid grandson on adventures across the universe."},{"id":65942,"type":"tv","title":"Re:ZERO -Starting Life in Another World-","poster":"/5MrRCj7z92YLWMXHeWKp19eJPYv.jpg","date":"2016-04-04","overview":"Natsuki Subaru, an ordinary high school  student, is on his way home from the convenience store when he finds  himself transported to another world. As he's lost and confused in a new  world where he doesn't even know left from right, the only person to  reach out to him was a beautiful girl with silver hair. Determined to  repay her somehow for saving him from his own despair, Subaru agrees to  help the girl find something she's looking for."},{"id":135934,"type":"tv","title":"The Legend of Vox Machina","poster":"/zjQTSYZEmy0GVnK1aFLvNiAwluo.jpg","date":"2022-01-27","overview":"They're rowdy, they're ragtag, they're misfits turned mercenaries for hire. Vox Machina is more interested in easy money and cheap ale than actually protecting the realm. But when the kingdom is threatened by evil, this boisterous crew realizes that they are the only ones capable of restoring justice."},{"id":90521,"type":"tv","title":"Love Island USA","poster":"/kU2y21cls8WargMaX7KI47URMjD.jpg","date":"2019-07-09","overview":"The matchmaking begins as a group of single \"Islanders\" come together in a stunning villa on a beautiful tropical island, ready to embark on a summer of dating, romance, and ultimately, relationships. Every few days the Islanders pair up and those who are not coupled are at risk of being dumped from the island. Islanders are on the lookout for romance, but the road to love doesn't always run smoothly."},{"id":284725,"type":"tv","title":"Not Suitable for Work","poster":"/hpucDFIvWwcn6sXk8EOEX0dbY0C.jpg","date":"2026-06-02","overview":"Follow five work-obsessed twenty-somethings striving for professional success and, if they have time, personal happiness in Manhattan's most glamorous neighborhood, Murray Hill."},{"id":299167,"type":"tv","title":"Dutton Ranch","poster":"/xsiecCxd8lkcAluw0wWwbW5CwSv.jpg","date":"2026-05-15","overview":"Rip Wheeler and Beth Dutton gamble everything on a new life in South Texas, but the promise of building a future far from the ghosts of Yellowstone quickly collides with brutal new realities and a rival ranch that will stop at nothing to protect its empire."},{"id":218342,"type":"tv","title":"A Good Girl's Guide to Murder","poster":"/1JjckYI0TkaUEXVZHyr52P2yejp.jpg","date":"2024-07-10","overview":"Five years after the death of schoolgirl Andie Bell, Pippa Fitz-Amobi sets out to uncover what really happened to her. Sal Singh, Andie's boyfriend, admitted to the murder before taking his own life, but Pip doesn't believe he's responsible and teams up with Sal's brother Ravi to uncover the truth. If Sal Singh isn't a murderer and the real killer is still out there, how far will they go to keep Pip from finding out the truth?"},{"id":323111,"type":"tv","title":"Michael Jackson: The Verdict","poster":"/8R40yI5AJ931Hd3P4Yf8pdFgwJ1.jpg","date":"2026-06-03","overview":"Told by key players who were inside the courtroom, this comprehensive documentary dissects the trial of Michael Jackson and his complex legacy."},{"id":224941,"type":"tv","title":"The Boroughs","poster":"/oKxBWbXmnWFO2Wh1QRTtshdfIRa.jpg","date":"2026-05-21","overview":"In a seemingly perfect retirement community, a crew of unlikely heroes must stop an otherworldly threat from stealing the one thing they don't have: time."},{"id":284110,"type":"tv","title":"The Lead","poster":"/vnoSyfH40sisQ6jBSap7NB3LD4H.jpg","date":"2026-05-10","overview":"Yi Qin'e is taken to the cultural troupe by her uncle Hu Sanyuan to learn to sing Qinqiang Opera. From then on, her life unfolds with ups and downs. She achieves glorious artistic accomplishments, yet also experiences a profound sense of loneliness beyond ordinary people's comprehension."},{"id":289147,"type":"tv","title":"The Ferry Man 10th Anniversary","poster":"/9ilVMG2ueA0xrviD0A9WoluAcnF.jpg","date":"2026-06-02","overview":"At Mirage City's 444 Convenience Store, Xia Dongqing and Ya join forces with a cryptic Night Watcher to maintain the balance between realms—until a crimson moon exposes a hidden conspiracy. Though peace returns, new anomalies stir in the shadows."},{"id":87917,"type":"tv","title":"For All Mankind","poster":"/JP3DItWMbrrLiKR5AYUfpsNf2b.jpg","date":"2019-11-01","overview":"Explore an aspirational world where NASA and the space program remained a priority and a focal point of our hopes and dreams as told through the lives of NASA astronauts, engineers, and their families."},{"id":2734,"type":"tv","title":"Law & Order: Special Victims Unit","poster":"/iofokHZoUB4Qhik4PflvJl8TT6a.jpg","date":"1999-09-20","overview":"In the criminal justice system, sexually-based offenses are considered especially heinous. In New York City, the dedicated detectives who investigate these vicious felonies are members of an elite squad known as the Special Victims Unit. These are their stories."},{"id":2354,"type":"tv","title":"Home and Away","poster":"/vn0eKMiG69bhQtxb7qLRo8SSqu5.jpg","date":"1988-01-18","overview":"Home and Away is set in the fictional town of Summer Bay, a coastal town in New South Wales, and follows the personal and professional lives of the people living in the area. The show initially focused on the Fletcher family, Pippa and Tom Fletcher and their five foster children Frank Morgan, Carly Morris, Steven Matheson, Lynn Davenport and Sally Keating, who would go on to become one of the show's longest-running characters. The show also originally and currently focuses on the Stewart family. Home and Away had proved popular when it premiered in 1988 and had risen to become a hit in Australia, and after only a few weeks, the show tackled its first major and disturbing storyline, the rape of Carly Morris; it was one of the first shows to feature such storylines during the early timeslot. H&A has tackled many adult-themed and controversial storylines; something rarely found in its restricted timeslot."},{"id":79744,"type":"tv","title":"The Rookie","poster":"/70kTz0OmjjZe7zHvIDrq2iKW7PJ.jpg","date":"2018-10-16","overview":"Starting over isn't easy, especially for small-town guy John Nolan who, after a life-altering incident, is pursuing his dream of being an LAPD officer. As the force's oldest rookie, he's met with skepticism from some higher-ups who see him as just a walking midlife crisis."},{"id":549,"type":"tv","title":"Law & Order","poster":"/haJ9eHytVO3H3JooMJG1DiWwDNm.jpg","date":"1990-09-13","overview":"In cases ripped from the headlines, police investigate serious and often deadly crimes, weighing the evidence and questioning the suspects until someone is taken into custody. The district attorney's office then builds a case to convict the perpetrator by proving the person guilty beyond a reasonable doubt. Working together, these expert teams navigate all sides of the complex criminal justice system to make New York a safer place."},{"id":1416,"type":"tv","title":"Grey's Anatomy","poster":"/hjJkrLXhWvGHpLeLBDFznpBTY1S.jpg","date":"2005-03-27","overview":"Follows the personal and professional lives of a group of doctors at Seattle's Grey Sloan Memorial Hospital."},{"id":1622,"type":"tv","title":"Supernatural","poster":"/8iixmfGx5EIFPdpNvB2JvI3VIqX.jpg","date":"2005-09-13","overview":"When they were boys, Sam and Dean Winchester lost their mother to a mysterious and demonic supernatural force. Subsequently, their father raised them to be soldiers. He taught them about the paranormal evil that lives in the dark corners and on the back roads of America ... and he taught them how to kill it. Now, the Winchester brothers crisscross the country in their '67 Chevy Impala, battling every kind of supernatural threat they encounter along the way. "},{"id":94722,"type":"tv","title":"Tagesschau","poster":"/7dFZJ2ZJJdcmkp05B9NWlqTJ5tq.jpg","date":"1952-12-26","overview":"German daily news program, the oldest still existing program on German television."},{"id":4614,"type":"tv","title":"NCIS","poster":"/mBcu8d6x6zB1el3MPNl7cZQEQ31.jpg","date":"2003-09-23","overview":"From murder and espionage to terrorism and stolen submarines, a team of special agents investigates any crime that has any connection to Navy and Marine Corps personnel, regardless of rank or position."},{"id":1399,"type":"tv","title":"Game of Thrones","poster":"/1XS1oqL89opfnbLl8WnZY1O1uJx.jpg","date":"2011-04-17","overview":"Seven noble families fight for control of the mythical land of Westeros. Friction between the houses leads to full-scale war. All while a very ancient evil awakens in the farthest north. Amidst the war, a neglected military order of misfits, the Night's Watch, is all that stands between the realms of men and icy horrors beyond."},{"id":4057,"type":"tv","title":"Criminal Minds","poster":"/hWSb4UnIjlTvnvrP98NbFSO60HA.jpg","date":"2005-09-22","overview":"An elite team of FBI profilers analyze the country's most twisted criminal minds, anticipating their next moves before they strike again. The Behavioral Analysis Unit's most experienced agent is David Rossi, a founding member of the BAU who returns to help the team solve new cases."},{"id":456,"type":"tv","title":"The Simpsons","poster":"/uWpG7GqfKGQqX4YMAo3nv5OrglV.jpg","date":"1989-12-17","overview":"Set in Springfield, the average American town, the show focuses on the antics and everyday adventures of the Simpson family; Homer, Marge, Bart, Lisa and Maggie, as well as a virtual cast of thousands. Since the beginning, the series has been a pop culture icon, attracting hundreds of celebrities to guest star. The show has also made name for itself in its fearless satirical take on politics, media and American life in general."},{"id":5920,"type":"tv","title":"The Mentalist","poster":"/acYXu4KaDj1NIkMgObnhe4C4a0T.jpg","date":"2008-09-23","overview":"Patrick Jane, a former celebrity psychic medium, uses his razor sharp skills of observation and expertise at \"reading\" people to solve serious crimes with the California Bureau of Investigation."},{"id":2261,"type":"tv","title":"The Tonight Show Starring Johnny Carson","poster":"/uSvET5YUvHNDIeoCpErrbSmasFb.jpg","date":"1962-10-01","overview":"The Tonight Show Starring Johnny Carson is a talk show hosted by Johnny Carson under The Tonight Show franchise from 1962 to 1992. It originally aired during late-night. For its first ten years, Carson's Tonight Show was based in New York City with occasional trips to Burbank, California; in May 1972, the show moved permanently to Burbank, California. In 2002, The Tonight Show Starring Johnny Carson was ranked #12 on TV Guide's 50 Greatest TV Shows of All Time."},{"id":1434,"type":"tv","title":"Family Guy","poster":"/3PFsEuAiyLkWsP4GG6dIV37Q6gu.jpg","date":"1999-01-31","overview":"Sick, twisted, politically incorrect and Freakin' Sweet animated series featuring the adventures of the dysfunctional Griffin family. Bumbling Peter and long-suffering Lois have three kids. Stewie (a brilliant but sadistic baby bent on killing his mother and taking over the world), Meg (the oldest, and is the most unpopular girl in town) and Chris (the middle kid, he's not very bright but has a passion for movies). The final member of the family is Brian - a talking dog and much more than a pet, he keeps Stewie in check whilst sipping Martinis and sorting through his own life issues."},{"id":22980,"type":"tv","title":"Watch What Happens Live with Andy Cohen","poster":"/onSD9UXfJwrMXWhq7UY7hGF2S1h.jpg","date":"2009-07-16","overview":"Bravo network executive Andy Cohen discusses pop culture topics with celebrities and reality show personalities."},{"id":1396,"type":"tv","title":"Breaking Bad","poster":"/ztkUQFLlC19CCMYHW9o1zWhJRNq.jpg","date":"2008-01-20","overview":"Walter White, a New Mexico chemistry teacher, is diagnosed with Stage III cancer and given a prognosis of only two years left to live. He becomes filled with a sense of fearlessness and an unrelenting desire to secure his family's financial future at any cost as he enters the dangerous world of drugs and crime."},{"id":209867,"type":"tv","title":"Frieren: Beyond Journey's End","poster":"/dqZENchTd7lp5zht7BdlqM7RBhD.jpg","date":"2023-09-29","overview":"After the party of heroes defeated the Demon King, they restored peace to the land and returned to lives of solitude.  Generations pass, and the elven mage Frieren comes face to face with humanity’s mortality. She takes on a new apprentice and promises to fulfill old friends’ dying wishes. Can an elven mind make peace with the nature of life and death? Frieren embarks on her quest to find out."},{"id":64010,"type":"tv","title":"Reply 1988","poster":"/i3xQJlQRff4k5IMEY55l4iKaKl3.jpg","date":"2015-11-06","overview":"Take a nostalgic trip back to the late 1980s through the lives of five families and their five teenage kids living in a small neighbourhood in Seoul."},{"id":246,"type":"tv","title":"Avatar: The Last Airbender","poster":"/9RQhVb3r3mCMqYVhLoCu4EvuipP.jpg","date":"2005-02-21","overview":"In a war-torn world of elemental magic, a young boy reawakens to undertake a dangerous mystic quest to fulfill his destiny as the Avatar, and bring peace to the world."},{"id":94605,"type":"tv","title":"Arcane","poster":"/abf8tHznhSvl9BAElD2cQeRr7do.jpg","date":"2021-11-06","overview":"Amid the stark discord of twin cities Piltover and Zaun, two sisters fight on rival sides of a war between magic technologies and clashing convictions."},{"id":250307,"type":"tv","title":"The Pitt","poster":"/kvFSpESyBZMjaeOJDx7RS3P1jey.jpg","date":"2025-01-09","overview":"The staff of Pittsburgh's Trauma Medical Center work around the clock to save lives in an overcrowded and underfunded emergency department."},{"id":85077,"type":"tv","title":"The Chosen","poster":"/dqVUFuNrMFWt7uGNWlpo91VKYOI.jpg","date":"2019-04-21","overview":"The life of Christ through the eyes of those who encountered him."},{"id":301507,"type":"tv","title":"Heated Rivalry","poster":"/3YCKbtAkYWCMDLHvkUjGhG7eWoS.jpg","date":"2025-11-28","overview":"Two of the biggest stars in Major League Hockey are bound by ambition, rivalry, and a magnetic pull neither of them fully understands. What begins as a secret fling between two fresh faced rookies evolves into a years-long journey of love, denial, and self-discovery. Over the next eight years, as they chase glory on the ice, they struggle to navigate their feelings for each other. Torn between the sport they live for and the love they can’t ignore, they must decide if there’s room in their fiercely competitive world for something as fragile – and powerful – as real love."},{"id":87108,"type":"tv","title":"Chernobyl","poster":"/hlLXt2tOPT6RRnjiUmoxyG1LTFi.jpg","date":"2019-05-06","overview":"The true story of one of the worst man-made catastrophes in history: the catastrophic nuclear accident at Chernobyl. A tale of the brave men and women who sacrificed to save Europe from unimaginable disaster."},{"id":219246,"type":"tv","title":"When Life Gives You Tangerines","poster":"/1VC3sEFxYXYDqQUCAnvWfUsYg1s.jpg","date":"2025-03-07","overview":"In Jeju, a spirited girl and a steadfast boy's island story blossoms into a lifelong tale of setbacks and triumphs — proving love endures across time."},{"id":31911,"type":"tv","title":"Fullmetal Alchemist: Brotherhood","poster":"/5ZFUEOULaVml7pQuXxhpR2SmVUw.jpg","date":"2009-04-05","overview":"Disregard for alchemy’s laws ripped half of Edward Elric’s limbs from his body and left his brother Alphonse’s soul clinging to a suit of armor. To restore what was lost, the brothers seek the Philosopher’s Stone. Enemies and allies – the corrupt military, the Homunculi, and foreign alchemists – will alter the Elric brothers course, but their purpose will remain unchanged and their bond unbreakable."},{"id":60059,"type":"tv","title":"Better Call Saul","poster":"/zjg4jpK1Wp2kiRvtt5ND0kznako.jpg","date":"2015-02-08","overview":"Six years before Saul Goodman meets Walter White. We meet him when the man who will become Saul Goodman is known as Jimmy McGill, a small-time lawyer searching for his destiny, and, more immediately, hustling to make ends meet. Working alongside, and, often, against Jimmy, is “fixer” Mike Ehrmantraut. The series tracks Jimmy’s transformation into Saul Goodman, the man who puts “criminal” in “criminal lawyer\"."},{"id":271607,"type":"tv","title":"The Fragrant Flower Blooms with Dignity","poster":"/g1sYAQt0OeCxzyfagSEqxUlsLnt.jpg","date":"2025-07-06","overview":"When the intimidating Rintaro meets the open-minded Kaoruko, the unlikely duo grows closer. The issue? Their neighboring high schools hate each other."},{"id":1429,"type":"tv","title":"Attack on Titan","poster":"/hTP1DtLGFamjfu8WqjnuQdP1n4i.jpg","date":"2013-04-07","overview":"100 years ago, the last remnants of humanity were forced to retreat behind the towering walls of a fortified city to escape the massive, man-eating Titans that roamed the land outside their fortress. Only the members of the Scouting Legion dared to stray beyond the safety of the walls – but even those brave warriors seldom returned alive. Those within the city clung to the illusion of a peaceful existence until the day that dream was shattered, and their slim chance at survival was reduced to one horrifying choice: kill – or be devoured!"},{"id":1398,"type":"tv","title":"The Sopranos","poster":"/rTc7ZXdroqjkKivFPvCPX0Ru7uw.jpg","date":"1999-01-10","overview":"The story of New Jersey-based Italian-American mobster Tony Soprano and the difficulties he faces as he tries to balance the conflicting requirements of his home life and the criminal organization he heads. Those difficulties are often highlighted through his ongoing professional relationship with psychiatrist Jennifer Melfi. The show features Tony's family members and Mafia associates in prominent roles and story arcs, most notably his wife Carmela and his cousin and protégé Christopher Moltisanti."},{"id":200709,"type":"tv","title":"Weak Hero","poster":"/dbqNBeLvAWFqpAvdBc0cecaqytT.jpg","date":"2022-11-18","overview":"With the aid of unexpected friends, a gifted but introverted student confronts bullies and violent foes — unaware of how dangerous his world will become."}];

 (async()=>{try{await nxLoadRemoteConfig()}catch(_){}el.querySelector('#aiConnection').textContent=NEXORA_API.GEMINI_API_KEY?'● API configured':'○ API key needed';el.querySelector('#aiModelLabel').textContent=NEXORA_API.GEMINI_MODEL||'Gemini'})();

em"><img src="${esc(x.art||'')}" width="42" height="42" style="border-radius:8px" alt=""><strong>${esc(x.artist)} — ${esc(x.title)}</strong><button class="btn" data-play="${i}">▶</button><button class="btn" data-save="${i}">♡</button></div>`).join('')||'<p>No results found.</p>';el.querySelectorAll('[data-play]').forEach(b=>b.onclick=()=>play(items[+b.dataset.play]));el.querySelectorAll('[data-save]').forEach(b=>b.onclick=()=>{let x=items[+b.dataset.save];if(!favorites.some(f=>f.preview===x.preview))favorites.push(x);put('musicFav',favorites);drawFav();toast('Added to favorites')})}catch(e){el.querySelector('#musicResults').innerHTML='<p class="muted">Search failed. Check your connection or browser restrictions.</p>'}};el.querySelector('#musicQuery').onkeydown=e=>{if(e.key==='Enter')el.querySelector('#musicGo').click()};drawFav()};

RENDER.settings=el=>{
const palettes=[['Arcade Mint','#53ffbf'],['Electric Blue','#38bdf8'],['Hot Pink','#ff4da6'],['Laser Purple','#a78bfa'],['Toxic Lime','#c4ff4d'],['Neon Orange','#ff914d'],['Pure White','#f4f7fa']];
const themes=[['Arcade Black','Dark arcade','#050609','#11191e','#53ffbf','#314149'],['Midnight','Deep blue black','#070c16','#152236','#38bdf8','#35485a'],['Light Mode','Bright and clean','#f0f4f8','#dae4ec','#137a64','#b1c4ce']];
el.innerHTML=header('Settings','Tune the look and feel of your arcade')+`<div class="visual-studio"><div class="vs-intro"><div class="vs-symbol">🎨</div><div><h3>VISUALS STUDIO</h3><p>Customize your Nexora. Every change previews instantly.</p></div></div><section class="card"><p class="vs-label">01 / THEME</p><div class="vs-grid" id="vsThemes">${themes.map((t,i)=>`<button class="vs-theme" data-theme="${i}" style="--mock-bg:${t[2]};--mock-panel:${t[3]};--mock-accent:${t[4]};--mock-line:${t[5]}"><div class="mock"><div class="mock-top"></div><div class="mock-row"><div class="mock-tile"></div><div class="mock-tile"></div><div class="mock-tile"></div></div></div><span class="theme-name">${t[0]}</span><span class="theme-sub">${t[1]}</span></button>`).join('')}</div></section><section class="card"><p class="vs-label">02 / NEON COLOR</p><div class="vs-swatches" id="vsSwatches">${palettes.map(([name,color])=>`<button class="vs-swatch" data-color="${color}" style="--swatch:${color}" title="${name}" aria-label="${name}"></button>`).join('')}<label style="display:flex;align-items:center;gap:7px;margin:0 0 0 8px">Custom <input type="color" id="accent" value="#53ffbf" style="width:42px;height:42px;background:transparent;border:0;cursor:pointer"></label></div></section><section class="card"><p class="vs-label">03 / EFFECTS & LAYOUT</p><div class="vs-control"><div><strong>Interface animations</strong><p>Window entrances, menus and hover transitions</p></div><input class="vs-switch" type="checkbox" id="motionToggle" aria-label="Interface animations"></div><div class="vs-control"><div><strong>Neon glow</strong><p>Highlights around buttons and game cards</p></div><input class="vs-switch" type="checkbox" id="glowToggle" aria-label="Neon glow"></div><div class="vs-control"><div><strong>Connected particles</strong><p>Drifting dots and lines on your home screen</p></div><input class="vs-switch" type="checkbox" id="particleToggle" aria-label="Connected particles"></div><div class="vs-control"><div><strong>Compact game cards</strong><p>Fit more games on the screen</p></div><input class="vs-switch" type="checkbox" id="compactToggle" aria-label="Compact cards"></div><div class="vs-control"><div><strong>Home widgets</strong><p>Show quick info on the home screen</p></div><input class="vs-switch" type="checkbox" id="widgetsToggle" aria-label="Home widgets"></div></section><section class="card"><p class="vs-label">04 / LIVE PREVIEW</p><div class="vs-live"><div class="vs-live-head"><span class="vs-live-title">NEXORA <span style="color:var(--accent)">5</span></span><span class="chip">ARCADE MODE</span></div><div class="vs-live-content"><div class="vs-live-card">🎮 <strong>GAMES</strong><p class="muted mini">Your next game starts here</p></div><div class="vs-live-card">🎵 <strong>MUSIC</strong><p class="muted mini">Your sound, your style</p></div></div><div class="vs-live-content"><span class="vs-live-chip filled">PLAY NOW</span><span class="vs-live-chip">MORE APPS</span></div></div></section><section class="card"><p class="vs-label">05 / WALLPAPER</p><div class="row"><button class="btn" id="wallUpload">📷 Upload wallpaper</button><button class="btn" id="wallClear">✕ Remove wallpaper</button><button class="btn" id="resetVisuals">↺ Reset visuals</button></div><p class="muted mini">Your wallpaper stays in this browser. Solid backgrounds are used by default.</p></section><section class="card"><p class="vs-label">06 / BACKUP & RESTORE</p><p class="muted">Export preferences, favorites, watchlist and notes. Custom imported apps are stored separately.</p><div class="row"><button class="btn" id="exportBackup">↓ Export settings JSON</button><button class="btn" id="importBackup">↑ Import settings JSON</button></div></section><section class="card"><p class="vs-label">ABOUT</p><p>NEXORA 5 · Neon Arcade UI</p><p class="muted">Standalone HTML with optional online game sources.</p></section></div>`;
const save=()=>{put('prefs',prefs);applyPrefs();refresh()};
const refresh=()=>{el.querySelectorAll('[data-theme]').forEach(b=>b.classList.toggle('selected',Number(b.dataset.theme)===(prefs.theme==='light'?2:prefs.theme==='midnight'?1:0)));el.querySelectorAll('[data-color]').forEach(b=>b.classList.toggle('selected',b.dataset.color.toLowerCase()===(prefs.accent||'#53ffbf').toLowerCase()));el.querySelector('#accent').value=prefs.accent||'#53ffbf';for(const [id,key,def] of [['motionToggle','motion',true],['glowToggle','glow',true],['particleToggle','particles',true],['compactToggle','compact',false],['widgetsToggle','widgets',false]])el.querySelector('#'+id).checked=prefs[key]??def};
el.querySelectorAll('[data-theme]').forEach(b=>b.onclick=()=>{prefs.theme=['dark','midnight','light'][Number(b.dataset.theme)];save()});el.querySelectorAll('[data-color]').forEach(b=>b.onclick=()=>{prefs.accent=b.dataset.color;save()});el.querySelector('#accent').oninput=e=>{prefs.accent=e.target.value;save()};for(const [id,key] of [['motionToggle','motion'],['glowToggle','glow'],['particleToggle','particles'],['compactToggle','compact'],['widgetsToggle','widgets']])el.querySelector('#'+id).onchange=e=>{prefs[key]=e.target.checked;save()};
el.querySelector('#wallUpload').onclick=()=>$('#wallFile').click();el.querySelector('#wallClear').onclick=()=>{prefs.wall='';save()};el.querySelector('#resetVisuals').onclick=()=>{if(!confirm('Reset your visual preferences?'))return;Object.assign(prefs,{accent:'#53ffbf',theme:'dark',motion:true,glow:true,particles:true,compact:false,widgets:false,wall:''});save()};
$('#wallFile').onchange=e=>{let f=e.target.files[0];if(!f)return;if(f.size>1500000)return toast('Choose an image under 1.5 MB');let r=new FileReader();r.onload=()=>{prefs.wall=r.result;save()};r.readAsDataURL(f)};
el.querySelector('#exportBackup').onclick=()=>{let obj={version:1,prefs,notes:get('notes',''),watch:get('watch',[]),musicFav:get('musicFav',[]),aiDraft:get('aiDraft','')},blob=new Blob([JSON.stringify(obj,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='nexora5-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),5000)};
el.querySelector('#importBackup').onclick=()=>$('#backupFile').click();$('#backupFile').onchange=async e=>{let f=e.target.files[0];if(!f)return;try{let j=JSON.parse(await f.text());if(j.version!==1)throw Error();if(!confirm('Replace saved preferences and favorites from this backup?'))return;for(let k of ['prefs','notes','watch','musicFav','aiDraft'])if(k in j)put(k,j[k]);prefs=get('prefs',prefs);applyPrefs();refresh();toast('Backup imported. Reopen apps to see changes.')}catch{toast('Invalid backup file')}};refresh()};
async function init(){renderHome();applyPrefs();try{db=await openDB();await reloadCustom()}catch(e){toast('Local app storage unavailable in this browser')}tick()}init();

// Non-invasive connectivity report: no bypass attempts and no unverified blocker accusations.
(function(){let lines=document.getElementById('diagLines'),count=document.getElementById('diagCount'),retry=document.getElementById('diagRetry');if(!lines)return;let issues=[];function line(label,detail,bad){return `<div class="diag-line ${bad?'warn':'ok'}">${bad?'⚠':'✓'} <b>${esc(label)}</b> — ${esc(detail)}</div>`}async function check(){issues=[];let out=[];if(!navigator.onLine){issues.push('Offline');out.push(line('Internet','Browser reports offline. Games, music, movies and public chat may not load.',true))}else out.push(line('Internet','Browser reports online; individual sites may still be restricted.',false));if(!window.supabase?.createClient){issues.push('Public Chat');out.push(line('Messages','Realtime library did not load; public chat and movie sync cannot connect.',true))}else out.push(line('Messages','Realtime client loaded; actual chat connection is checked inside Messages.',false));try{let ctl=new AbortController(),timer=setTimeout(()=>ctl.abort(),5500);try{let r=await fetch('https://itunes.apple.com/search?term=test&limit=1',{signal:ctl.signal});if(!r.ok)throw Error('HTTP '+r.status);out.push(line('Music','iTunes API responded.',false))}finally{clearTimeout(timer)}}catch(e){issues.push('Music');out.push(line('Music','Preview search unreachable ('+(e.name==='AbortError'?'timeout':e.message)+'). Network filtering is one possible cause.',true))}out.push(line('Movies','Catalog is built in; poster images and spreadsheet require external access.',false));out.push(line('Games','External game hosts are checked when a game is launched.',false));lines.innerHTML=out.join('');count.textContent=issues.length?issues.length+' POSSIBLE ISSUES':'NO ISSUES DETECTED'}retry.onclick=check;setTimeout(check,600)})();
// Lightweight moving network behind the home screen; respects visual settings and reduced-motion.
(function(){const canvas=document.getElementById('particleNet');if(!canvas)return;const ctx=canvas.getContext('2d');if(!ctx)return;let pts=[],w=0,h=0;const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;function size(){let rect=canvas.getBoundingClientRect(),dpr=Math.min(devicePixelRatio||1,2);w=rect.width;h=rect.height;canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);pts=Array.from({length:Math.min(90,Math.max(35,Math.floor(w*h/14500)))},()=>({x:Math.random()*w,y:Math.random()*h,vx:(Math.random()-.5)*.48,vy:(Math.random()-.5)*.48,r:1+Math.random()*1.2}))}function draw(){ctx.clearRect(0,0,w,h);if(prefs.particles!==false){let color=(prefs.accent||'#53ffbf');for(let i=0;i<pts.length;i++){let a=pts[i];if(!reduced){a.x+=a.vx;a.y+=a.vy;if(a.x<0||a.x>w)a.vx*=-1;if(a.y<0||a.y>h)a.vy*=-1}for(let j=i+1;j<pts.length;j++){let b=pts[j],dx=a.x-b.x,dy=a.y-b.y,d=dx*dx+dy*dy;if(d<195*195){ctx.strokeStyle='rgba(106,198,173,'+(0.27*(1-d/(195*195))).toFixed(3)+')';ctx.lineWidth=.85;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke()}}ctx.fillStyle=i%4===0?color:'#648c88';ctx.globalAlpha=.7;ctx.beginPath();ctx.arc(a.x,a.y,a.r,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1}}requestAnimationFrame(draw)}size();addEventListener('resize',size);requestAnimationFrame(draw)})();
</script></body></html>
