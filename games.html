 tip.style.cssText='position:absolute;z-index:100;right:-9px;top:calc(100% + 17px);width:235px;padding:13px 14px;border:1px solid #50efb1;border-radius:12px;background:#10251f;color:#f4fff9;box-shadow:0 12px 35px #000a;text-align:left;white-space:normal;font:13px/1.45 system-ui;';
 tip.innerHTML='<div style="position:absolute;right:28px;top:-9px;width:15px;height:15px;transform:rotate(45deg);background:#10251f;border-left:1px solid #50efb1;border-top:1px solid #50efb1"></div><strong style="display:block;margin-bottom:5px">Game not loading?</strong><span>Try the ↗ New tab button above to run the game outside the embedded player.</span><button type="button" class="nx-tip-ok" style="display:block;margin-top:10px;padding:6px 18px;background:#42dfa3;color:#062117;border:0;border-radius:7px;font-weight:700;cursor:pointer">OK</button>';
 anchor.appendChild(tip);
 tip.querySelector('.nx-tip-ok').onclick=e=>{e.stopPropagation();tip.remove()};
}
function nxStandaloneGame(g,html){
 let output=html;
 if(g.url){try{
   const base=new URL('.',new URL(g.url,location.href)).href;
   const tag='<base href="'+base.replace(/&/g,'&amp;').replace(/"/g,'&quot;')+'">';
   output=/<head\b[^>]*>/i.test(output)?output.replace(/<head([^>]*)>/i,'<head$1>'+tag):tag+output;
 }catch(e){}}
 return output;
}
function nxLocalGameHtml(g){
 const name=g.id==='snake'?'snakeGame':'clickGame';
 const fn=g.id==='snake'?snakeGame:clickGame;
 return '<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>'+esc(g.title)+'</title><style>body{margin:0;padding:20px;background:#080e18;color:#f4fbff;font:16px system-ui;text-align:center}.btn{background:#18283b;border:1px solid #53ffbf;color:white;padding:12px 18px;border-radius:10px;cursor:pointer}canvas{max-width:95vw}</style></head><body><main id="game"></main><script>'+fn.toString()+';('+name+')(document.getElementById("game"));<\/script></body></html>';
}
async function nxGetPlayableHtml(g){
 if(g.kind==='local')return nxLocalGameHtml(g);
 const html=await nxGameHtml(g);
 if(!html)throw Error('This game provides a URL, but no downloadable HTML source');
 return nxStandaloneGame(g,html);
}
function openGame(g){
 let id='play:'+g.id;
 if(windows.has(id)){let old=windows.get(id);old.style.display='flex';old.style.zIndex=++topZ;return}
 let w=document.createElement('section');w.className='window full';w.style.zIndex=++topZ;
 w.innerHTML=`<div class="bar"><span class="title">🎮 ${esc(g.title)}</span><button class="btn" id="playTab">↗ New tab</button><button class="btn" id="playDownload">↓ Download game</button><button class="btn" id="playFull">⛶ Fullscreen</button><button class="btn" id="playClose">✕</button></div><div class="content" id="playArea" style="padding:0;display:flex;flex-direction:column;overflow:hidden;min-height:0"></div>`;
 $('#workspace').append(w);windows.set(id,w);
 const el=w.querySelector('#playArea');let blobUrl=null;
 const release=()=>{if(blobUrl){URL.revokeObjectURL(blobUrl);blobUrl=null}};
 w.querySelector('#playClose').onclick=()=>{release();w.remove();windows.delete(id)};
 const notice=document.createElement('div');notice.className='notice';notice.style.cssText='flex:none;padding:8px 12px;font-size:12px';notice.textContent='Loading '+g.title+'…';
 if(g.kind==='local'){
   if(g.id==='snake')snakeGame(el);else clickGame(el);
 }else{
   el.append(notice);
   const frame=document.createElement('iframe');frame.title=g.title;frame.style.cssText='flex:1;min-height:0;width:100%;border:0;background:#000';frame.setAttribute('allow','fullscreen; gamepad');frame.setAttribute('allowfullscreen','');
   frame.setAttribute('sandbox','allow-scripts allow-forms allow-pointer-lock allow-popups allow-modals allow-downloads allow-same-origin');el.append(frame);
   (async()=>{try{const html=await nxGetPlayableHtml(g);if(!el.isConnected)return;blobUrl=URL.createObjectURL(new Blob([html],{type:'text/html'}));frame.src=blobUrl;notice.textContent='If the embedded game is blank, try New tab to run its HTML directly.'}catch(e){if(g.url){frame.src=g.url;notice.textContent='Embedding the original URL. If blocked, try New tab. '+e.message}else notice.textContent=e.message}})();
 }
 w.querySelector('#playFull').onclick=async()=>{
   const target=el.querySelector('iframe')||el;
   try{if(document.fullscreenElement)await document.exitFullscreen();else if(target.requestFullscreen)await target.requestFullscreen();else throw Error('Fullscreen unavailable in this browser')}catch(e){toast('Fullscreen unavailable: '+e.message)}
 };
 w.querySelector('#playTab').onclick=async()=>{
   // Open synchronously inside click, before any fetch, to avoid popup blocking.
   const tab=window.open('about:blank','_blank');
   if(!tab){toast('Allow pop-ups to open games in a new tab');return}
   try{tab.document.title='Loading '+g.title;tab.document.body.style.cssText='background:#080b10;color:#dfffee;font:16px system-ui;padding:30px';tab.document.body.textContent='Loading '+g.title+'…'}catch(e){}
   try{
     const html=await nxGetPlayableHtml(g);
     if(tab.closed)return;
     tab.document.open();tab.document.write(html);tab.document.close();
   }catch(e){
     if(g.url){try{tab.location.replace(g.url)}catch(_){};toast('HTML could not be retrieved; opened the game source instead')}
     else{try{tab.document.body.textContent='Unable to load game: '+e.message}catch(_){}}
   }
 };
 w.querySelector('#playDownload').onclick=async()=>{
   const btn=w.querySelector('#playDownload');btn.disabled=true;btn.textContent='Preparing…';
   try{
     const html=await nxGetPlayableHtml(g);
     const blob=new Blob([html],{type:'text/html;charset=utf-8'}),url=URL.createObjectURL(blob);
     const a=document.createElement('a');a.href=url;a.download=(g.title||'game').replace(/[^a-z0-9._ -]/gi,'_').slice(0,90)+'.html';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);
   }catch(e){toast('Cannot download game HTML: '+e.message)}
   finally{btn.disabled=false;btn.textContent='↓ Download game'}
 };
}
function clickGame(el){el.innerHTML='<div style="text-align:center;padding:25px"><h2>⚡ Click Rush</h2><p>Click as many times as you can in 10 seconds.</p><h1 id="score">0</h1><p id="remaining">10 seconds</p><button class="btn primary" id="tap" style="font-size:24px;padding:25px 45px">START / TAP</button></div>';let score=0,started=0,interval;el.querySelector('#tap').onclick=()=>{if(!started){started=Date.now();interval=setInterval(()=>{let left=Math.max(0,10-Math.floor((Date.now()-started)/1000));if(!el.isConnected){clearInterval(interval);return}el.querySelector('#remaining').textContent=left+' seconds';if(!left){clearInterval(interval);el.querySelector('#tap').disabled=true;el.querySelector('#remaining').textContent='Finished!'}} ,100)}if(Date.now()-started<10000)el.querySelector('#score').textContent=++score}}
function snakeGame(el){el.innerHTML='<div style="text-align:center"><h2>🐍 Snake</h2><p>Use arrow keys or WASD. Eat the yellow squares.</p><canvas width="360" height="360" id="snake" style="max-width:95%;background:#0c1728;border:1px solid #42618d;border-radius:8px"></canvas><p id="snakeScore">Score: 0</p><button class="btn" id="snakeReset">Restart</button><div class="row" style="justify-content:center;margin-top:10px"><button class="btn" data-dir="up">↑</button><button class="btn" data-dir="left">←</button><button class="btn" data-dir="down">↓</button><button class="btn" data-dir="right">→</button></div></div>';let cv=el.querySelector('canvas'),ctx=cv.getContext('2d'),snake,dir,food,score,alive,timer;const N=18;function reset(){snake=[{x:8,y:9},{x:7,y:9}];dir={x:1,y:0};food={x:12,y:9};score=0;alive=true;el.querySelector('#snakeScore').textContent='Score: 0'}function setDir(k){let d={up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]}[k];if(d&&!(dir.x===-d[0]&&dir.y===-d[1]))dir={x:d[0],y:d[1]}}function key(e){let k=({ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',w:'up',s:'down',a:'left',d:'right'})[e.key];if(k&&el.isConnected){e.preventDefault();setDir(k)}}document.addEventListener('keydown',key);el.querySelectorAll('[data-dir]').forEach(b=>b.onclick=()=>setDir(b.dataset.dir));el.querySelector('#snakeReset').onclick=reset;reset();timer=setInterval(()=>{if(!el.isConnected){clearInterval(timer);document.removeEventListener('keydown',key);return}if(alive){let head={x:snake[0].x+dir.x,y:snake[0].y+dir.y},eat=head.x===food.x&&head.y===food.y;if(head.x<0||head.x>=N||head.y<0||head.y>=N||snake.slice(0,eat?undefined:-1).some(p=>p.x===head.x&&p.y===head.y)){alive=false;el.querySelector('#snakeScore').textContent='Game over! Score: '+score}else{snake.unshift(head);if(eat){score++;el.querySelector('#snakeScore').textContent='Score: '+score;do{food={x:Math.floor(Math.random()*N),y:Math.floor(Math.random()*N)}}while(snake.some(p=>p.x===food.x&&p.y===food.y))}else snake.pop()}}ctx.fillStyle='#0c1728';ctx.fillRect(0,0,360,360);ctx.fillStyle='#ffd36e';ctx.fillRect(food.x*20+2,food.y*20+2,16,16);ctx.fillStyle='#76d9b3';snake.forEach(p=>ctx.fillRect(p.x*20+2,p.y*20+2,16,16))},125)}

try{const root=document.getElementById('appRoot');RENDER["games"](root)}catch(err){document.getElementById('appRoot').textContent='Could not start Games: '+err.message;console.error(err)}
</script></body></html>
