.top,.home,.dock{z-index:1}

.movie-grid{grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:15px}

body{min-height:100vh;background:#070b10;color:#f5f7fc;margin:0}#standaloneTop{display:flex;align-items:center;gap:12px;padding:14px 22px;border-bottom:1px solid #304047;background:#101820}#standaloneTop h1{font-size:18px;margin:0;flex:1}#appRoot{padding:20px;max-width:1440px;margin:0 auto;min-height:calc(100vh - 65px)}#workspace{position:fixed;inset:0;pointer-events:none;z-index:100}#workspace>.window{pointer-events:auto;display:flex}#toast{position:fixed;right:15px;bottom:20px;padding:12px 16px;background:#1e3530;border:1px solid #53ffbf;border-radius:10px;color:white;display:none;z-index:9999}@media(max-width:650px){#appRoot{padding:12px}}
</style></head><body><header id="standaloneTop"><span style="font-size:27px">⚙️</span><h1>Settings</h1><span class="muted">Standalone app</span></header><main id="appRoot"></main><div id="workspace"></div><div id="toast"></div><script>
'use strict';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const get=(k,d)=>{try{return JSON.parse(localStorage.getItem('nx5_'+k))??d}catch{return d}};
const put=(k,v)=>{try{localStorage.setItem('nx5_'+k,JSON.stringify(v))}catch(e){toast('Storage unavailable')}};
function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';setTimeout(()=>e.style.display='none',3600)}
function header(name,sub=''){return `<div class="head"><div><h2>${name}</h2>${sub?`<div class="muted">${sub}</div>`:''}</div></div>`}
const RENDER={};let windows=new Map(),topZ=11,db,custom=[];
RENDER.settings=el=>{const pref=get('prefs',{accent:'#53ffbf',theme:'dark'});el.innerHTML=header('Settings','Preferences for standalone apps')+`<div class="card"><label>Accent color <input type="color" id="accent" value="${esc(pref.accent||'#53ffbf')}"></label><label>Theme <select class="field" id="theme"><option value="dark">Dark</option><option value="midnight">Midnight</option><option value="light">Light</option></select></label><button class="btn primary" id="savePrefs">Save settings</button><p class="muted">Standalone app preferences are stored in this browser.</p></div><div class="card"><button class="btn" id="exportBackup">Export settings</button><input type="file" id="backupFile" accept="application/json" hidden><button class="btn" id="importBackup">Import settings</button></div>`;el.querySelector('#theme').value=pref.theme||'dark';el.querySelector('#savePrefs').onclick=()=>{put('prefs',{...pref,accent:el.querySelector('#accent').value,theme:el.querySelector('#theme').value});toast('Saved')};el.querySelector('#exportBackup').onclick=()=>{let a=document.createElement('a'),u=URL.createObjectURL(new Blob([JSON.stringify({version:1,prefs:get('prefs',{}),notes:get('notes',''),watch:get('watch',[]),musicFav:get('musicFav',[])},null,2)],{type:'application/json'}));a.href=u;a.download='nexora-settings.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};el.querySelector('#importBackup').onclick=()=>el.querySelector('#backupFile').click();el.querySelector('#backupFile').onchange=async e=>{try{const d=JSON.parse(await e.target.files[0].text());if(d.version!==1)throw Error('Unsupported version');for(const k of ['prefs','notes','watch','musicFav'])if(k in d)put(k,d[k]);toast('Imported');}catch(err){toast(err.message)}}};
try{const root=document.getElementById('appRoot');RENDER["settings"](root)}catch(err){document.getElementById('appRoot').textContent='Could not start Settings: '+err.message;console.error(err)}
</script></body></html>
